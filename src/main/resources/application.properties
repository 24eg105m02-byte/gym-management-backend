spring.application.name=gym-management

spring.datasource.url=jdbc:mysql://localhost:3306/gym_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:dexter}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# JWT (override with env JWT_SECRET in production)
app.jwt.secret=${JWT_SECRET:FitCoreSecretKeyForJwtTokenGenerationMustBeLongEnough2024SecureKey}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seed demo accounts on startup (development)
app.seed.enabled=true
